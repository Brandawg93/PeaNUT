name: Tested-device automation tests

on:
  pull_request:
    paths:
      - '.github/automation/tested-device*'
      - '.github/ISSUE_TEMPLATE/tested_device.yml'
      - '.github/workflows/tested-device*.yml'
  push:
    branches: [main]
    paths:
      - '.github/automation/tested-device*'
      - '.github/ISSUE_TEMPLATE/tested_device.yml'
      - '.github/workflows/tested-device*.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test .github/automation/tested-device.test.mjs
